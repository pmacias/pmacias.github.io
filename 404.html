<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages serves this for any unrecognized path (e.g. /about).
    // Stash the intended path and bounce to index.html, which reads it
    // back out of sessionStorage and shows the right section.
    sessionStorage.redirect = location.pathname;
  </script>
  <meta http-equiv="refresh" content="0;URL='/'">
</head>
<body>
  <p>Redirecting to <a href="/">pmacias.github.io</a>…</p>
</body>
</html>
